# main·작업 브랜치에 push하거나 PR을 열면 테스트를 돌림(서버 update.sh도 반영 전에 같은 테스트를 돌림)
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 문법 검사
        run: python -m compileall -q app.py tracker
      - name: 테스트
        run: python -m unittest discover -s tests -v
