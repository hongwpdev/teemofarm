# 프로젝트 이름을 따로 고정해서 같은 NAS의 다른 스택과 섞이지 않게 함
name: lck-stove

services:
  tracker:
    build: .
    container_name: lck-stove-tracker
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./data:/data
    environment:
      WIKI_INTERVAL_SEC: "300"
      NEWS_INTERVAL_SEC: "600"
      NEW_HOURS: "3"
      # TEAMS_FILE: /data/teams.json   # 팀 추가·검색어 변경 시
